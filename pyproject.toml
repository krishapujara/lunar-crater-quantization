[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-crater-quantization"
version = "1.0.0"
description = "Micro-Quantized CNN for Onboard Crater Detection — Chandrayaan-Inspired Lunar Research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Research Engineering Team", email = "research@antigravity.internal" }
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "streamlit>=1.32.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "onnxscript>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]
postgres = [
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
